# ==========================================================================
# 	LINUX INCIDENT RESPONSE COLLECTOR - CONFIGURATION
# ==========================================================================
#
#  Directory where generated reports will be stored
MODIFIED_DAYS=7

#  Maxmimum number of shell-history lines collected per user
MAX_LOGIN_RECORDS=100

# Directories searched for recently modified files
SCAN_PATH=(
	"/etc"
	"/home"
	"/tmp"
	"/Var/tmp"
)
#Directories excluded from file searches
EXCLUDED_PATHS=(
	"/proc"
	"/sys"
	"/dev"
	"/run"
	"/mnt"
	"/media"
)

# Enable or disable evidence modules
# # Use "true" to enable and "false" to disable
COLLECT_SYSTEM_INFO=true
COLLECT_PROCESSES=true
COLLECT_USERS=true
COLLECT_NETWORK_CONNECTIONS=true
COLLECT_LISTENING_PORTS=true
COLLECT_SCHEDULED_JOBS=true
COLLECT_COMMAND_HISTORY=true
COLLECT_MODIFIED_FILES=true
#
# # Include error messages inside evidence reports
INCLUDE_COMMAND_ERRORS=true
#
# # Create a summary file after collection
CREATE_SUMMARY_REPORT=true
#
# # Compress the final incident report directory
# # Keep disabled for the first project version
COMPRESS_REPORT=false


